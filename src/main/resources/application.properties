# Aplicación de escritorio: sin servidor web.
spring.application.name=huella-empresas
spring.main.web-application-type=none
spring.main.banner-mode=off

# Conexión MariaDB. Credenciales SOLO por variables de entorno (ver .devcontainer/.env).
# Zona horaria de sesión forzada a UTC en cada conexión (driver + init SQL de Hikari).
spring.datasource.url=jdbc:mariadb://${HUELLA_DB_HOST:db}:${HUELLA_DB_PORT:3306}/${HUELLA_DB_NAME:sg_huella_carbono_revision}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${HUELLA_DB_USER:}
spring.datasource.password=${HUELLA_DB_PASSWORD:}
spring.datasource.hikari.pool-name=huella-pool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
# No fallar el arranque si la BD no responde: la interfaz muestra un error y permite reintentar.
spring.datasource.hikari.initialization-fail-timeout=-1

# La aplicación NUNCA crea ni modifica el esquema al arrancar.
spring.sql.init.mode=never

logging.level.root=WARN
logging.level.edu.huella=INFO
